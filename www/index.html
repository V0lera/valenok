<section id="setup" class="wrap">
  <h1 class="logo">Валенок<small>карточная игра на 2–4 игрока</small></h1>
  <div class="field">
    <label class="label" for="nameIn">Ваше имя</label>
    <input type="text" id="nameIn" maxlength="14" placeholder="Вы" autocomplete="off">
  </div>
  <div class="seg tabs" id="modeSeg" style="grid-template-columns:1fr 1fr">
    <button data-act="mode" data-m="bots" aria-pressed="true">С ботами</button>
    <button data-act="mode" data-m="friends" aria-pressed="false">С друзьями</button>
  </div>
  <div class="field">
    <span class="label">Таймер хода</span>
    <div class="seg" id="timerSeg" style="grid-template-columns:1fr 1fr">
      <button data-act="timer" data-t="20" aria-pressed="true">20 секунд</button>
      <button data-act="timer" data-t="0" aria-pressed="false">Без таймера</button>
    </div>
  </div>
  <div id="panelBots" class="panel">
    <div class="field">
      <span class="label">Соперники-боты</span>
      <div class="seg" id="botSeg">
        <button data-act="bots" data-n="1" aria-pressed="false">1 бот</button>
        <button data-act="bots" data-n="2" aria-pressed="true">2 бота</button>
        <button data-act="bots" data-n="3" aria-pressed="false">3 бота</button>
      </div>
    </div>
    <div class="row col">
      <button class="btn primary" data-act="start">Начать игру</button>
      <button class="btn" data-act="continue" id="contBtn" hidden>Продолжить партию</button>
    </div>
  </div>
  <div id="panelFriends" class="panel" hidden>
    <button class="btn primary" data-act="create">Создать комнату</button>
    <div class="field">
      <label class="label" for="codeIn">Или войдите по коду друга</label>
      <div class="joinrow">
        <input type="text" id="codeIn" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
        <button class="btn" data-act="join">Войти</button>
      </div>
    </div>
    <button class="btn" data-act="rejoin" id="rejoinBtn" hidden></button>
    <p class="netmsg" id="netMsg" role="status"></p>
  </div>
  <details class="memo" id="memo1"></details>
</section>

<section id="lobby" class="wrap" hidden>
  <div class="lobby-head">
    <span class="label">Комната</span>
    <div class="code" id="lobbyCode">0000</div>
    <p id="lobbyHint">Скажите друзьям этот код: они вводят его в «С друзьями → Войти».</p>
  </div>
  <ul class="lobby-seats" id="lobbySeats"></ul>
  <div class="row col" id="lobbyBtns"></div>
  <p class="netmsg" id="lobbyMsg" role="status"></p>
</section>

<section id="app" class="wrap" hidden>
  <div class="bar">
    <div class="title"><span class="brand">Валенок</span><span class="round" id="roundLbl"></span></div>
    <button class="snd icon" data-act="sound" id="sndBtn" aria-pressed="true" aria-label="Звук"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></g><g class="x"><path d="M17 9.5l5 5M22 9.5l-5 5"/></g></svg></button>
    <button data-act="score">Счёт</button>
    <button data-act="exit">Выйти</button>
  </div>
  <div id="seats"></div>
  <div id="table">
    <div id="decor" aria-hidden="true"></div>
    <button class="deck" id="deck" data-act="draw" aria-label="Колода"><div class="back"></div><div class="back"></div><div class="back"></div><span class="n" id="deckN"></span></button>
    <div class="pile" id="pile"></div>
    <div id="suitBadge"></div>
    <div id="toastBox"></div>
  </div>
  <div id="status"></div>
  <div id="clock" aria-hidden="true"><div class="track"><i></i></div><b></b></div>
  <div id="log"></div>
  <div class="me" id="me"></div>
  <div id="handWrap"><div id="hand"></div></div>
  <div class="actions">
    <button class="btn" id="drawBtn" data-act="draw">Взять карту</button>
    <button class="btn" id="passBtn" data-act="pass">Пас</button>
    <button class="btn primary" id="playBtn" data-act="play">Сходить</button>
  </div>
</section>

<div id="overlay" hidden><div class="sheet" id="sheet"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
