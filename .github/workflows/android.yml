# Собирает подписанный APK при каждом изменении в main и выкладывает его в Releases.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Проверить ключ подписи
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Добавьте секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > valenok.keystore

      - name: Установить Capacitor
        run: npm install --no-audit --no-fund

      - name: Создать Android-проект
        run: |
          npx cap add android
          npm run android:assets
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Подписать APK
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks valenok.keystore --ks-pass "pass:$PW" --key-pass "pass:$PW" --ks-key-alias valenok --out Valenok.apk aligned.apk
          "$BT/apksigner" verify Valenok.apk
          rm valenok.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Valenok-apk
          path: Valenok.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Валенок 1.0.${{ github.run_number }}
          body: Скачайте Valenok.apk ниже и откройте его на телефоне Android.
          files: Valenok.apk
          make_latest: true
